<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Quản lý sản phẩm - AJAX</title>
    <style>
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
        .modal-body .form-group {
            margin-bottom: 15px;
        }
        .preview-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }
        .price-text {
            color: #dc3545;
            font-weight: bold;
        }
        .stock-text {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="m-0"><i class="bi bi-box"></i> Quản lý sản phẩm (AJAX)</h3>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAddModal()">
                    <i class="bi bi-plus"></i> Thêm sản phẩm
                </button>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Search Form -->
            <div class="row g-2 mb-3">
                <div class="col-sm-4 col-md-3">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Tìm theo tên..." />
                </div>
                <div class="col-sm-3 col-md-2">
                    <select id="categoryFilter" class="form-select">
                        <option value="">Tất cả danh mục</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" onclick="searchProducts()">
                        <i class="bi bi-search"></i> Tìm kiếm
                    </button>
                    <button class="btn btn-outline-secondary" onclick="loadProducts()">
                        <i class="bi bi-arrow-clockwise"></i> Làm mới
                    </button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <!-- Products Table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Hình ảnh</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th style="width: 120px;">Giá</th>
                                <th style="width: 100px;">Tồn kho</th>
                                <th style="width: 100px;">Đã bán</th>
                                <th style="width: 160px;" class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Data will be loaded here via AJAX -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Product Modal -->
        <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalLabel">Thêm sản phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="productForm" enctype="multipart/form-data">
                    <div class="modal-body">
                        <input type="hidden" id="productId" name="id">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="productName" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="productName" name="productName" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="price" class="form-label">Giá <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="price" name="price" min="0" step="0.01" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="stock" class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="stock" name="stock" min="0" required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="categoryId" class="form-label">Danh mục <span class="text-danger">*</span></label>
                                    <select class="form-select" id="categoryId" name="categoryId" required>
                                        <option value="">Chọn danh mục</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label for="userId" class="form-label">Người tạo <span class="text-danger">*</span></label>
                                    <select class="form-select" id="userId" name="userId" required>
                                        <option value="">Chọn người tạo</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label for="productImage" class="form-label">Hình ảnh</label>
                                    <input type="file" class="form-control" id="productImage" name="image" accept="image/*" onchange="previewImage(this)">
                                    <div id="imagePreview"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary" id="saveButton">Lưu</button>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script layout:fragment="scripts">
    let currentProductId = null;
    let categories = [];
    let users = [];

    // Load products on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadCategories();
        loadUsers();
        loadProducts();
    });

    // Load all products
    function loadProducts() {
        showLoading(true);
        fetch('/api/product')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                showLoading(false);
                if (data.status) {
                    renderProductsTable(data.body);
                } else {
                    showAlert('error', 'Lỗi: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Lỗi AJAX:', error);
                showLoading(false);
                showAlert('error', 'Lỗi khi tải danh sách: ' + error.message);
            });
    }

    // Load categories for dropdown
    function loadCategories() {
        fetch('/api/category')
            .then(response => response.json())
            .then(data => {
                if (data.status) {
                    categories = data.body;
                    populateCategoryDropdown();
                }
            })
            .catch(error => console.error('Lỗi khi tải danh mục:', error));
    }

    // Load users for dropdown
    function loadUsers() {
        fetch('/api/user')
            .then(response => response.json())
            .then(data => {
                if (data.status) {
                    users = data.body;
                    populateUserDropdown();
                }
            })
            .catch(error => console.error('Lỗi khi tải người dùng:', error));
    }

    // Populate category dropdown
    function populateCategoryDropdown() {
        const categorySelect = document.getElementById('categoryFilter');
        const categorySelectModal = document.getElementById('categoryId');
        
        const options = categories.map(cat => 
            `<option value="${cat.category_id || cat.id}">${cat.categoryName}</option>`
        ).join('');
        
        categorySelect.innerHTML = '<option value="">Tất cả danh mục</option>' + options;
        categorySelectModal.innerHTML = '<option value="">Chọn danh mục</option>' + options;
    }

    // Populate user dropdown
    function populateUserDropdown() {
        const userSelect = document.getElementById('userId');
        
        const options = users.map(user => 
            `<option value="${user.id}">${user.fullname || user.fullName} (${user.username})</option>`
        ).join('');
        
        userSelect.innerHTML = '<option value="">Chọn người tạo</option>' + options;
    }

    // Search products
    function searchProducts() {
        const keyword = document.getElementById('searchKeyword').value;
        const categoryId = document.getElementById('categoryFilter').value;
        
        let url = '/api/product';
        const params = new URLSearchParams();
        
        if (keyword.trim()) {
            params.append('name', keyword);
        }
        if (categoryId) {
            url = `/api/product/category/${categoryId}`;
        }
        
        if (params.toString()) {
            url += '?' + params.toString();
        }

        showLoading(true);
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                showLoading(false);
                if (data.status) {
                    renderProductsTable(data.body);
                } else {
                    showAlert('error', 'Lỗi: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Lỗi search:', error);
                showLoading(false);
                showAlert('error', 'Lỗi khi tìm kiếm: ' + error.message);
            });
    }

    // Render products table
    function renderProductsTable(products) {
        const tbody = document.getElementById('productsTableBody');
        if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Không có dữ liệu</td></tr>';
            return;
        }

        tbody.innerHTML = products.map(product => `
            <tr>
                <td>${product.product_id || product.id}</td>
                <td>
                    ${product.image ? 
                        `<img src="/image?fname=${product.image}" alt="product" class="product-image"/>` : 
                        '<span class="text-muted">(chưa có)</span>'
                    }
                </td>
                <td>
                    <div>
                        <strong>${product.productName}</strong>
                        ${product.description ? `<br><small class="text-muted">${product.description.substring(0, 50)}${product.description.length > 50 ? '...' : ''}</small>` : ''}
                    </div>
                </td>
                <td>${product.category ? product.category.categoryName : 'N/A'}</td>
                <td class="price-text">${formatPrice(product.price)}</td>
                <td class="stock-text">${product.stock}</td>
                <td>${product.purchases || 0}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-secondary" onclick="editProduct(${product.product_id || product.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.product_id || product.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Format price
    function formatPrice(price) {
        return new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(price);
    }

    // Open add modal
    function openAddModal() {
        currentProductId = null;
        document.getElementById('productModalLabel').textContent = 'Thêm sản phẩm';
        document.getElementById('saveButton').textContent = 'Lưu';
        document.getElementById('productForm').reset();
        document.getElementById('imagePreview').innerHTML = '';
    }

    // Edit product
    function editProduct(id) {
        currentProductId = id;
        fetch(`/api/product/${id}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status) {
                    const product = data.body;
                    document.getElementById('productModalLabel').textContent = 'Sửa sản phẩm';
                    document.getElementById('saveButton').textContent = 'Cập nhật';
                    document.getElementById('productId').value = product.product_id || product.id;
                    document.getElementById('productName').value = product.productName;
                    document.getElementById('description').value = product.description || '';
                    document.getElementById('price').value = product.price;
                    document.getElementById('stock').value = product.stock;
                    document.getElementById('categoryId').value = product.category ? (product.category.category_id || product.category.id) : '';
                    document.getElementById('userId').value = product.user ? product.user.id : '';
                    
                    // Show current image
                    if (product.image) {
                        document.getElementById('imagePreview').innerHTML = 
                            `<img src="/image?fname=${product.image}" class="preview-image" alt="Current image">`;
                    }
                    
                    const modal = new bootstrap.Modal(document.getElementById('productModal'));
                    modal.show();
                } else {
                    showAlert('error', 'Lỗi: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Lỗi khi load product:', error);
                showAlert('error', 'Lỗi khi tải thông tin sản phẩm: ' + error.message);
            });
    }

    // Delete product
    function deleteProduct(id) {
        if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
            fetch(`/api/product/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status) {
                    showAlert('success', 'Xóa sản phẩm thành công!');
                    loadProducts();
                } else {
                    showAlert('error', 'Lỗi: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Lỗi khi xóa:', error);
                showAlert('error', 'Lỗi khi xóa sản phẩm: ' + error.message);
            });
        }
    }

    // Handle form submission
    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('productName', document.getElementById('productName').value);
        formData.append('description', document.getElementById('description').value);
        formData.append('price', document.getElementById('price').value);
        formData.append('stock', document.getElementById('stock').value);
        formData.append('categoryId', document.getElementById('categoryId').value);
        formData.append('userId', document.getElementById('userId').value);
        
        const imageFile = document.getElementById('productImage').files[0];
        if (imageFile) {
            formData.append('image', imageFile);
        }

        const url = currentProductId ? `/api/product/${currentProductId}` : '/api/product';
        const method = currentProductId ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.status) {
                showAlert('success', currentProductId ? 'Cập nhật sản phẩm thành công!' : 'Thêm sản phẩm thành công!');
                const modal = bootstrap.Modal.getInstance(document.getElementById('productModal'));
                modal.hide();
                loadProducts();
            } else {
                showAlert('error', 'Lỗi: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Lỗi khi save:', error);
            showAlert('error', 'Lỗi khi lưu sản phẩm: ' + error.message);
        });
    });

    // Preview image
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = `<img src="${e.target.result}" class="preview-image" alt="Preview">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Show/hide loading
    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    // Show alert
    function showAlert(type, message) {
        const alertContainer = document.getElementById('alertContainer');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
        const icon = type === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
        
        alertContainer.innerHTML = `
            <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                <i class="bi ${icon}"></i> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
        
        // Auto hide after 5 seconds
        setTimeout(() => {
            const alert = alertContainer.querySelector('.alert');
            if (alert) {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }
        }, 5000);
    }
</script>
</body>
</html>
