<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{web/layout.html}">
<head>
    <title>Sản phẩm giá thấp đến cao (GraphQL) - Product Manager</title>
    <style>
        .product-card {
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-thumbnail {
            height: 200px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        .price-badge {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
        }
        .sort-info {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <!-- Header Section -->
        <div class="container my-4">
            <div class="sort-info text-center">
                <h2 class="mb-3">
                    <i class="bi bi-sort-down"></i> Sản phẩm giá thấp đến cao (GraphQL)
                </h2>
                <p class="mb-0">Sắp xếp sản phẩm theo giá từ thấp đến cao sử dụng GraphQL</p>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="container mb-4">
            <div class="row">
                <div class="col-md-6">
                    <button class="btn btn-primary" onclick="loadProductsByPrice()">
                        <i class="bi bi-arrow-clockwise"></i> Tải lại
                    </button>
                    <a href="/" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-house"></i> Trang chủ
                    </a>
                </div>
                <div class="col-md-6 text-end">
                    <span id="productCount" class="badge bg-primary fs-6">0 sản phẩm</span>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-3 fs-5">Đang tải sản phẩm theo giá...</p>
        </div>

        <!-- Products Grid -->
        <div class="container">
            <div id="productsContainer">
                <div class="row" id="productsRow">
                    <!-- Products will be loaded here via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="container" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card text-center py-5">
                        <div class="card-body">
                            <i class="bi bi-box display-1 text-muted mb-3"></i>
                            <h4 class="text-muted">Không có sản phẩm nào</h4>
                            <p class="text-muted">Hiện tại chưa có sản phẩm nào trong hệ thống.</p>
                            <a href="/" class="btn btn-primary">
                                <i class="bi bi-house"></i> Về trang chủ
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="container" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="alert alert-danger text-center">
                        <i class="bi bi-exclamation-triangle display-4 mb-3"></i>
                        <h4>Lỗi tải dữ liệu</h4>
                        <p id="errorMessage" class="mb-3">Đã xảy ra lỗi khi tải sản phẩm.</p>
                        <button class="btn btn-danger" onclick="loadProductsByPrice()">
                            <i class="bi bi-arrow-clockwise"></i> Thử lại
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            // GraphQL endpoint
            const GRAPHQL_ENDPOINT = '/graphql';

            // Show/hide loading spinner
            function showLoading(show) {
                const spinner = document.getElementById('loadingSpinner');
                const container = document.getElementById('productsContainer');
                const emptyState = document.getElementById('emptyState');
                const errorState = document.getElementById('errorState');
                
                if (show) {
                    spinner.style.display = 'block';
                    container.style.display = 'none';
                    emptyState.style.display = 'none';
                    errorState.style.display = 'none';
                } else {
                    spinner.style.display = 'none';
                    container.style.display = 'block';
                }
            }

            // Show empty state
            function showEmptyState() {
                const container = document.getElementById('productsContainer');
                const emptyState = document.getElementById('emptyState');
                const errorState = document.getElementById('errorState');
                
                container.style.display = 'none';
                emptyState.style.display = 'block';
                errorState.style.display = 'none';
            }

            // Show error state
            function showErrorState(message) {
                const container = document.getElementById('productsContainer');
                const emptyState = document.getElementById('emptyState');
                const errorState = document.getElementById('errorState');
                const errorMessage = document.getElementById('errorMessage');
                
                container.style.display = 'none';
                emptyState.style.display = 'none';
                errorState.style.display = 'block';
                errorMessage.textContent = message;
            }

            // Execute GraphQL query
            async function executeGraphQL(query, variables = {}) {
                try {
                    const response = await fetch(GRAPHQL_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            variables: variables
                        })
                    });

                    const result = await response.json();
                    
                    if (result.errors) {
                        throw new Error(result.errors[0].message);
                    }
                    
                    return result.data;
                } catch (error) {
                    console.error('GraphQL Error:', error);
                    throw error;
                }
            }

            // Load products by price (ascending)
            async function loadProductsByPrice() {
                console.log('Loading products by price...');
                showLoading(true);

                const query = `
                    query {
                        productsByPriceAsc {
                            id
                            productName
                            description
                            image
                            price
                            purchases
                            stock
                            category {
                                id
                                categoryName
                            }
                            user {
                                id
                                fullName
                                userName
                            }
                        }
                    }
                `;

                try {
                    console.log('Executing GraphQL query...');
                    const data = await executeGraphQL(query);
                    console.log('GraphQL response:', data);
                    console.log('Products by price loaded:', data.productsByPriceAsc);
                    
                    if (!data.productsByPriceAsc || data.productsByPriceAsc.length === 0) {
                        console.log('No products found, showing empty state');
                        showEmptyState();
                        return;
                    }
                    
                    console.log('Displaying products:', data.productsByPriceAsc.length);
                    displayProducts(data.productsByPriceAsc);
                } catch (error) {
                    console.error('Error loading products by price:', error);
                    showErrorState(error.message);
                } finally {
                    showLoading(false);
                }
            }

            // Display products
            function displayProducts(products) {
                console.log('Displaying products function called with:', products);
                const row = document.getElementById('productsRow');
                const countBadge = document.getElementById('productCount');
                
                console.log('Row element:', row);
                console.log('Count badge element:', countBadge);
                
                countBadge.textContent = `${products.length} sản phẩm`;

                row.innerHTML = products.map((product, index) => `
                    <div class="col-md-6 col-lg-4 col-xl-3 mb-4">
                        <div class="card product-card h-100">
                            <div class="product-thumbnail position-relative">
                                ${product.image ? 
                                    `<img src="/image?fname=${product.image}" alt="Product Image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` +
                                    `<div style="display:none; align-items: center; justify-content: center; width: 100%; height: 100%;"><i class="bi bi-box" style="font-size: 3rem;"></i></div>` :
                                    `<div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"><i class="bi bi-box" style="font-size: 3rem;"></i></div>`
                                }
                                <div class="position-absolute top-0 start-0 m-2">
                                    <span class="badge bg-primary">#${index + 1}</span>
                                </div>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.productName}</h5>
                                <p class="card-text text-muted flex-grow-1">${product.description || 'Không có mô tả'}</p>
                                
                                <div class="mt-auto">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="price-badge">${new Intl.NumberFormat('vi-VN').format(product.price)} VNĐ</span>
                                        <small class="text-muted">
                                            <i class="bi bi-eye"></i> ${product.purchases || 0}
                                        </small>
                                    </div>
                                    
                                    <div class="row text-center">
                                        <div class="col-6">
                                            <small class="text-muted d-block">Danh mục</small>
                                            <small class="fw-bold">${product.category?.categoryName || 'N/A'}</small>
                                        </div>
                                        <div class="col-6">
                                            <small class="text-muted d-block">Tồn kho</small>
                                            <small class="fw-bold">${product.stock || 0}</small>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-2">
                                        <small class="text-muted">
                                            <i class="bi bi-person"></i> ${product.user?.fullName || 'N/A'}
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Load products when page loads
            document.addEventListener('DOMContentLoaded', function() {
                console.log('Products by price page loaded');
                console.log('DOM elements check:');
                console.log('- productsRow:', document.getElementById('productsRow'));
                console.log('- productCount:', document.getElementById('productCount'));
                console.log('- loadingSpinner:', document.getElementById('loadingSpinner'));
                console.log('- productsContainer:', document.getElementById('productsContainer'));
                loadProductsByPrice();
            });
        </script>
    </div>
</body>
</html>
