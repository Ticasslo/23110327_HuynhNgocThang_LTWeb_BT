<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Thêm/Sửa người dùng - Admin Panel</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="m-0">
                    <i class="bi bi-people"></i> 
                    <span id="pageTitle">Thêm người dùng (GraphQL)</span>
                </h3>
                <a href="/admin/users" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer">
                <!-- Alerts will be shown here via JavaScript -->
            </div>

            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form id="userForm">
                        
                        <!-- Hidden field for ID -->
                        <input type="hidden" id="userId">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="userName" class="form-label">
                                        <i class="bi bi-person"></i> Tên đăng nhập <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="userName" 
                                           placeholder="Nhập tên đăng nhập"
                                           required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">
                                        <i class="bi bi-person-badge"></i> Họ và tên <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="fullName" 
                                           placeholder="Nhập họ và tên"
                                           required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope"></i> Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" 
                                           class="form-control" 
                                           id="email" 
                                           placeholder="Nhập email"
                                           required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="phone" class="form-label">
                                        <i class="bi bi-phone"></i> Số điện thoại
                                    </label>
                                    <input type="tel" 
                                           class="form-control" 
                                           id="phone" 
                                           placeholder="Nhập số điện thoại">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-lock"></i> Mật khẩu <span class="text-danger">*</span>
                                    </label>
                                    <input type="password" 
                                           class="form-control" 
                                           id="password" 
                                           placeholder="Nhập mật khẩu"
                                           required>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="roleid" class="form-label">
                                        <i class="bi bi-shield"></i> Vai trò <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" id="roleid" required>
                                        <option value="">-- Chọn vai trò --</option>
                                        <option value="0">User</option>
                                        <option value="1">Admin</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="avatarFile" class="form-label">
                                        <i class="bi bi-image"></i> Ảnh đại diện
                                    </label>
                                    <input type="file" 
                                           class="form-control" 
                                           id="avatarFile" 
                                           name="avatarFile"
                                           accept="image/*">
                                </div>
                            </div>
                        </div>

                        <!-- Current Avatar Display -->
                        <div id="currentAvatarContainer" class="mb-3" style="display: none;">
                            <label class="form-label">Ảnh đại diện hiện tại:</label>
                            <div>
                                <img id="currentAvatar" 
                                     alt="Current Avatar" 
                                     class="img-thumbnail" 
                                     style="max-width: 200px; max-height: 200px; border-radius: 50%;">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-check-lg"></i> 
                                <span id="submitText">Thêm mới</span>
                            </button>
                            <a href="/admin/users" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            // GraphQL endpoint
            const GRAPHQL_ENDPOINT = '/graphql';

            // Get user ID from URL
            function getUserId() {
                const path = window.location.pathname;
                const matches = path.match(/\/edit\/(\d+)/);
                return matches ? parseInt(matches[1]) : null;
            }

            // Show alert message
            function showAlert(message, type = 'info') {
                const alertContainer = document.getElementById('alertContainer');
                const alertClass = type === 'error' ? 'alert-danger' : 
                                 type === 'success' ? 'alert-success' : 'alert-info';
                
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
                alertDiv.innerHTML = `
                    <i class="bi bi-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                alertContainer.appendChild(alertDiv);
            }

            // Execute GraphQL query
            async function executeGraphQL(query, variables = {}) {
                try {
                    const response = await fetch(GRAPHQL_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            variables: variables
                        })
                    });

                    const result = await response.json();
                    
                    if (result.errors) {
                        throw new Error(result.errors[0].message);
                    }
                    
                    return result.data;
                } catch (error) {
                    console.error('GraphQL Error:', error);
                    showAlert('Lỗi: ' + error.message, 'error');
                    throw error;
                }
            }

            // Load user by ID (for edit mode)
            async function loadUser() {
                const userId = getUserId();
                console.log('Loading user with ID:', userId);
                
                if (!userId) {
                    console.log('Add mode - setting default values');
                    return;
                }

                const query = `
                    query GetUser($id: Int!) {
                        user(id: $id) {
                            id
                            email
                            userName
                            fullName
                            password
                            avatar
                            roleid
                            phone
                            createdDate
                        }
                    }
                `;

                try {
                    const data = await executeGraphQL(query, { id: userId });
                    console.log('User data loaded:', data.user);
                    
                    if (!data.user) {
                        showAlert('Không tìm thấy người dùng!', 'error');
                        return;
                    }

                    // Fill form with user data
                    const user = data.user;
                    document.getElementById('userId').value = user.id;
                    document.getElementById('userName').value = user.userName;
                    document.getElementById('fullName').value = user.fullName;
                    document.getElementById('email').value = user.email;
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('password').value = user.password;
                    document.getElementById('roleid').value = user.roleid;

                    // Update submit button text
                    document.getElementById('submitText').textContent = 'Cập nhật';
                    
                    // Update page title
                    document.getElementById('pageTitle').textContent = 'Chỉnh sửa người dùng (GraphQL)';
                    
                    // Show current avatar if exists
                    if (user.avatar) {
                        document.getElementById('currentAvatar').src = `/image?fname=${user.avatar}`;
                        document.getElementById('currentAvatarContainer').style.display = 'block';
                    }

                } catch (error) {
                    console.error('Error loading user:', error);
                }
            }

            // Create user
            async function createUser(userData) {
                console.log('Creating user with data:', userData);
                
                const mutation = `
                    mutation CreateUser($input: UserInput!) {
                        createUser(input: $input) {
                            id
                            email
                            userName
                            fullName
                            avatar
                            roleid
                            phone
                            createdDate
                        }
                    }
                `;

                const input = {
                    email: userData.email,
                    userName: userData.userName,
                    fullName: userData.fullName,
                    password: userData.password,
                    avatar: userData.avatar || null,
                    roleid: parseInt(userData.roleid),
                    phone: userData.phone || null
                };

                try {
                    const data = await executeGraphQL(mutation, { input });
                    return data.createUser;
                } catch (error) {
                    console.error('Error creating user:', error);
                    throw error;
                }
            }

            // Update user
            async function updateUser(userData) {
                console.log('Updating user with data:', userData);
                
                const mutation = `
                    mutation UpdateUser($id: Int!, $input: UserInput!) {
                        updateUser(id: $id, input: $input) {
                            id
                            email
                            userName
                            fullName
                            avatar
                            roleid
                            phone
                            createdDate
                        }
                    }
                `;

                const input = {
                    email: userData.email,
                    userName: userData.userName,
                    fullName: userData.fullName,
                    password: userData.password,
                    avatar: userData.avatar || null,
                    roleid: parseInt(userData.roleid),
                    phone: userData.phone || null
                };

                const userId = parseInt(userData.id);

                try {
                    const data = await executeGraphQL(mutation, { id: userId, input });
                    return data.updateUser;
                } catch (error) {
                    console.error('Error updating user:', error);
                    throw error;
                }
            }

            // Handle form submission
            document.getElementById('userForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = {
                    id: document.getElementById('userId').value,
                    userName: document.getElementById('userName').value,
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    avatar: document.getElementById('avatarFile').value || null,
                    roleid: document.getElementById('roleid').value
                };

                // Validation
                if (!formData.userName || !formData.fullName || !formData.email || !formData.password || !formData.roleid) {
                    showAlert('Vui lòng điền đầy đủ các trường bắt buộc!', 'error');
                    return;
                }

                const submitBtn = document.getElementById('submitBtn');
                const submitText = document.getElementById('submitText');
                const isEdit = !!formData.id;

                submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>${isEdit ? 'Đang cập nhật...' : 'Đang thêm...'}`;
                submitBtn.disabled = true;

                try {
                    let result;
                    if (isEdit) {
                        result = await updateUser(formData);
                        showAlert('Cập nhật người dùng thành công!', 'success');
                    } else {
                        result = await createUser(formData);
                        showAlert('Thêm người dùng thành công!', 'success');
                    }
                    
                    // Redirect to list after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/admin/users';
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error saving user:', error);
                } finally {
                    submitBtn.innerHTML = `<i class="bi bi-check-lg"></i> ${isEdit ? 'Cập nhật' : 'Thêm mới'}`;
                    submitBtn.disabled = false;
                }
            });

            // Load data when page loads
            document.addEventListener('DOMContentLoaded', function() {
                loadUser();
            });
        </script>
    </div>
</body>
</html>
