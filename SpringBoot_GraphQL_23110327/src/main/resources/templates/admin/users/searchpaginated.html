<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Tìm kiếm người dùng - Admin Panel</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="m-0"><i class="bi bi-people"></i> Tìm kiếm người dùng phân trang (GraphQL)</h3>
                <a href="/admin/users" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer">
                <!-- Alerts will be shown here via JavaScript -->
            </div>

            <!-- Search Form -->
            <div class="row g-2 mb-3">
                <div class="col-sm-4 col-md-3">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Tìm theo tên..." />
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" onclick="searchUsers()">
                                <i class="bi bi-search"></i> Tìm kiếm
                            </button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                </div>
                <p class="mt-2">Đang tìm kiếm người dùng...</p>
            </div>

            <!-- Search Results -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Kết quả tìm kiếm</h5>
                    <span id="resultCount" class="badge bg-primary">0 kết quả</span>
                            </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Tên đăng nhập</th>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                                <th style="width: 100px;">Vai trò</th>
                                <th style="width: 120px;">Ngày tạo</th>
                                <th style="width: 140px;">Ảnh đại diện</th>
                                <th style="width: 160px;" class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Search results will be loaded here via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            // GraphQL endpoint
            const GRAPHQL_ENDPOINT = '/graphql';

            // Show alert message
            function showAlert(message, type = 'info') {
                const alertContainer = document.getElementById('alertContainer');
                const alertClass = type === 'error' ? 'alert-danger' : 
                                 type === 'success' ? 'alert-success' : 'alert-info';
                
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
                alertDiv.innerHTML = `
                    <i class="bi bi-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                alertContainer.appendChild(alertDiv);
            }

            // Show/hide loading spinner
            function showLoading(show) {
                const spinner = document.getElementById('loadingSpinner');
                const table = document.querySelector('.card');
                if (show) {
                    spinner.style.display = 'block';
                    table.style.display = 'none';
                } else {
                    spinner.style.display = 'none';
                    table.style.display = 'block';
                }
            }

            // Execute GraphQL query
            async function executeGraphQL(query, variables = {}) {
                try {
                    const response = await fetch(GRAPHQL_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            variables: variables
                        })
                    });

                    const result = await response.json();
                    
                    if (result.errors) {
                        throw new Error(result.errors[0].message);
                    }
                    
                    return result.data;
                } catch (error) {
                    console.error('GraphQL Error:', error);
                    showAlert('Lỗi: ' + error.message, 'error');
                    throw error;
                }
            }

            // Search users
            async function searchUsers() {
                const keyword = document.getElementById('searchKeyword').value.trim();
                console.log('Searching for keyword:', keyword);

                if (!keyword) {
                    showAlert('Vui lòng nhập từ khóa tìm kiếm!', 'error');
                    return;
                }

                showLoading(true);

                const query = `
                    query SearchUsers($keyword: String!) {
                        searchUsers(keyword: $keyword) {
                            id
                            email
                            userName
                            fullName
                            avatar
                            roleid
                            phone
                            createdDate
                        }
                    }
                `;

                try {
                    const data = await executeGraphQL(query, { keyword });
                    console.log('Search results:', data.searchUsers);
                    displayUsers(data.searchUsers);
                } catch (error) {
                    console.error('Error searching users:', error);
                } finally {
                    showLoading(false);
                }
            }

            // Display users in table
            function displayUsers(users) {
                const tbody = document.getElementById('usersTableBody');
                const countBadge = document.getElementById('resultCount');
                
                if (!users || users.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="text-center text-muted py-4">
                                <i class="bi bi-search"></i> Không tìm thấy kết quả
                            </td>
                        </tr>
                    `;
                    countBadge.textContent = '0 kết quả';
                    return;
                }

                countBadge.textContent = `${users.length} kết quả`;

                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.userName}</td>
                        <td>${user.fullName}</td>
                        <td>${user.email}</td>
                        <td>${user.phone || 'N/A'}</td>
                        <td>
                            <span class="badge ${user.roleid === 1 ? 'bg-danger' : 'bg-secondary'}">
                                ${user.roleid === 1 ? 'Admin' : 'User'}
                            </span>
                        </td>
                        <td>${user.createdDate ? new Date(user.createdDate).toLocaleDateString('vi-VN') : 'N/A'}</td>
                        <td>
                            ${user.avatar ? 
                                `<img src="/image?fname=${user.avatar}" alt="User Avatar" style="height:40px; width:40px; object-fit:cover; border-radius:50%;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` +
                                `<div style="display:none; height:40px; width:40px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:50%; align-items:center; justify-content:center;"><i class="bi bi-person text-muted"></i></div>` :
                                `<div style="height:40px; width:40px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="bi bi-person text-muted"></i></div>`
                            }
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" href="/admin/users/edit/${user.id}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            // Delete user
            async function deleteUser(userId) {
                if (!confirm('Bạn có chắc chắn muốn xóa người dùng này?')) {
                    return;
                }

                console.log('Deleting user with ID:', userId);

                const mutation = `
                    mutation DeleteUser($id: Int!) {
                        deleteUser(id: $id)
                    }
                `;

                try {
                    const data = await executeGraphQL(mutation, { id: userId });
                    
                    if (data.deleteUser) {
                        showAlert('Xóa người dùng thành công!', 'success');
                        searchUsers(); // Reload search results
                    } else {
                        showAlert('Không thể xóa người dùng!', 'error');
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showAlert('Lỗi xóa người dùng: ' + error.message, 'error');
                }
            }

            // Search on Enter key
            document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchUsers();
                }
            });

            // Load page
            document.addEventListener('DOMContentLoaded', function() {
                console.log('Search page loaded');
            });
        </script>
    </div>
</body>
</html>
