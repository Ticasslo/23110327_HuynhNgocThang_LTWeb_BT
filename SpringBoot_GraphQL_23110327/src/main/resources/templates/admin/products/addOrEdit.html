<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="m-0">
            <i class="bi bi-box"></i> 
            <span id="pageTitle">Thêm sản phẩm</span>
        </h3>
        <a href="/admin/products" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    <!-- Alert Messages -->
    <div id="alertContainer">
        <!-- Alerts will be shown here via JavaScript -->
    </div>

    <!-- Form -->
    <div class="card">
        <div class="card-body">
            <form id="productForm">
                
                <!-- Hidden field for ID -->
                <input type="hidden" id="productId">
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="productName" class="form-label">
                                <i class="bi bi-tag"></i> Tên sản phẩm <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="productName" 
                                   placeholder="Nhập tên sản phẩm"
                                   required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="categoryId" class="form-label">
                                <i class="bi bi-folder2-open"></i> Danh mục <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="categoryId" required>
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="userId" class="form-label">
                                <i class="bi bi-person"></i> Người tạo <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="userId" required>
                                <option value="">-- Chọn người tạo --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="price" class="form-label">
                                <i class="bi bi-currency-dollar"></i> Giá <span class="text-danger">*</span>
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="price" 
                                   placeholder="0.00"
                                   step="0.01"
                                   min="0"
                                   required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="stock" class="form-label">
                                <i class="bi bi-box-seam"></i> Số lượng tồn kho <span class="text-danger">*</span>
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="stock" 
                                   placeholder="0"
                                   min="0"
                                   required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="purchases" class="form-label">
                                <i class="bi bi-cart-check"></i> Số lượt mua
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="purchases" 
                                   placeholder="0"
                                   min="0">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        <i class="bi bi-file-text"></i> Mô tả
                    </label>
                    <textarea class="form-control" 
                              id="description" 
                              rows="3"
                              placeholder="Nhập mô tả sản phẩm"></textarea>
                </div>

                <div class="mb-3">
                    <label for="imageFile" class="form-label">
                        <i class="bi bi-image"></i> Hình ảnh
                    </label>
                    <input type="file" 
                           class="form-control" 
                           id="imageFile" 
                           name="imageFile"
                           accept="image/*">
                </div>

                <!-- Current Image Display -->
                <div id="currentImageContainer" class="mb-3" style="display: none;">
                    <label class="form-label">Hình ảnh hiện tại:</label>
                    <div>
                        <img id="currentImage" 
                             alt="Current Image" 
                             class="img-thumbnail" 
                             style="max-width: 200px; max-height: 200px;">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="bi bi-check-lg"></i> 
                        <span id="submitText">Thêm mới</span>
                    </button>
                    <a href="/admin/products" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
    // GraphQL endpoint
    const GRAPHQL_ENDPOINT = '/graphql';

    // Get product ID from URL
    function getProductId() {
        const path = window.location.pathname;
        const matches = path.match(/\/edit\/(\d+)/);
        return matches ? parseInt(matches[1]) : null;
    }

    // Show alert message
    function showAlert(message, type = 'info') {
        const alertContainer = document.getElementById('alertContainer');
        const alertClass = type === 'error' ? 'alert-danger' : 
                         type === 'success' ? 'alert-success' : 'alert-info';
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            <i class="bi bi-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        alertContainer.appendChild(alertDiv);
    }

    // Execute GraphQL query
    async function executeGraphQL(query, variables = {}) {
        try {
            const response = await fetch(GRAPHQL_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    query: query,
                    variables: variables
                })
            });

            const result = await response.json();
            
            if (result.errors) {
                throw new Error(result.errors[0].message);
            }
            
            return result.data;
        } catch (error) {
            console.error('GraphQL Error:', error);
            showAlert('Lỗi: ' + error.message, 'error');
            throw error;
        }
    }

    // Load categories for dropdown
    async function loadCategories() {
        const query = `
            query {
                categories {
                    id
                    categoryName
                }
            }
        `;

        try {
            const data = await executeGraphQL(query);
            const categorySelect = document.getElementById('categoryId');
            
            categorySelect.innerHTML = '<option value="">-- Chọn danh mục --</option>';
            data.categories.forEach(category => {
                categorySelect.innerHTML += `<option value="${category.id}">${category.categoryName}</option>`;
            });
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }

    // Load users for dropdown
    async function loadUsers() {
        const query = `
            query {
                users {
                    id
                    fullName
                    userName
                }
            }
        `;

        try {
            const data = await executeGraphQL(query);
            const userSelect = document.getElementById('userId');
            
            userSelect.innerHTML = '<option value="">-- Chọn người tạo --</option>';
            data.users.forEach(user => {
                userSelect.innerHTML += `<option value="${user.id}">${user.fullName} (${user.userName})</option>`;
            });
        } catch (error) {
            console.error('Error loading users:', error);
        }
    }

    // Load product by ID (for edit mode)
    async function loadProduct() {
        const productId = getProductId();
        console.log('Loading product with ID:', productId);
        
        if (!productId) {
            // Add mode - set default values
            document.getElementById('stock').value = '0';
            document.getElementById('purchases').value = '0';
            console.log('Add mode - setting default values');
            return;
        }

        const query = `
            query GetProduct($id: Int!) {
                product(id: $id) {
                    id
                    productName
                    description
                    price
                    stock
                    purchases
                    image
                    category {
                        id
                        categoryName
                    }
                    user {
                        id
                        fullName
                        userName
                    }
                }
            }
        `;

        try {
            const data = await executeGraphQL(query, { id: productId });
            console.log('Product data loaded:', data.product);
            
            if (!data.product) {
                showAlert('Không tìm thấy sản phẩm!', 'error');
                return;
            }

            // Fill form with product data
            const product = data.product;
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.productName;
            document.getElementById('description').value = product.description || '';
            document.getElementById('price').value = product.price;
            document.getElementById('stock').value = product.stock || 0;
            document.getElementById('purchases').value = product.purchases || 0;
            document.getElementById('categoryId').value = product.category?.id || '';
            document.getElementById('userId').value = product.user?.id || '';

            // Update submit button text
            document.getElementById('submitText').textContent = 'Cập nhật';
            
            // Update page title
            document.getElementById('pageTitle').textContent = 'Chỉnh sửa sản phẩm';
            
            // Show current image if exists
            if (product.image) {
                document.getElementById('currentImage').src = `/image?fname=${product.image}`;
                document.getElementById('currentImageContainer').style.display = 'block';
            }

        } catch (error) {
            console.error('Error loading product:', error);
        }
    }

    // Create product
    async function createProduct(productData) {
        console.log('Creating product with data:', productData);
        
        const mutation = `
            mutation CreateProduct($input: ProductInput!) {
                createProduct(input: $input) {
                    id
                    productName
                    description
                    price
                    stock
                    purchases
                    image
                    category {
                        id
                        categoryName
                    }
                    user {
                        id
                        fullName
                        userName
                    }
                }
            }
        `;

        const input = {
            productName: productData.productName,
            description: productData.description || null,
            image: productData.image || null,
            price: parseFloat(productData.price),
            stock: parseInt(productData.stock) || 0,
            purchases: parseInt(productData.purchases) || 0,
            categoryId: parseInt(productData.categoryId),
            userId: parseInt(productData.userId)
        };

        try {
            const data = await executeGraphQL(mutation, { input });
            return data.createProduct;
        } catch (error) {
            console.error('Error creating product:', error);
            throw error;
        }
    }

    // Update product
    async function updateProduct(productData) {
        console.log('Updating product with data:', productData);
        
        const mutation = `
            mutation UpdateProduct($id: Int!, $input: ProductInput!) {
                updateProduct(id: $id, input: $input) {
                    id
                    productName
                    description
                    price
                    stock
                    purchases
                    image
                    category {
                        id
                        categoryName
                    }
                    user {
                        id
                        fullName
                        userName
                    }
                }
            }
        `;

        const input = {
            productName: productData.productName,
            description: productData.description || null,
            image: productData.image || null,
            price: parseFloat(productData.price),
            stock: parseInt(productData.stock) || 0,
            purchases: parseInt(productData.purchases) || 0,
            categoryId: parseInt(productData.categoryId),
            userId: parseInt(productData.userId)
        };

        const productId = parseInt(productData.id);

        try {
            const data = await executeGraphQL(mutation, { id: productId, input });
            return data.updateProduct;
        } catch (error) {
            console.error('Error updating product:', error);
            throw error;
        }
    }

    // Handle form submission
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            id: document.getElementById('productId').value,
            productName: document.getElementById('productName').value,
            description: document.getElementById('description').value,
            price: document.getElementById('price').value,
            stock: document.getElementById('stock').value,
            purchases: document.getElementById('purchases').value,
            image: document.getElementById('imageFile').value || null,
            categoryId: document.getElementById('categoryId').value,
            userId: document.getElementById('userId').value
        };

        // Validation
        if (!formData.productName || !formData.price || !formData.categoryId || !formData.userId) {
            showAlert('Vui lòng điền đầy đủ các trường bắt buộc!', 'error');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const isEdit = !!formData.id;

        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>${isEdit ? 'Đang cập nhật...' : 'Đang thêm...'}`;
        submitBtn.disabled = true;

        try {
            let result;
            if (isEdit) {
                result = await updateProduct(formData);
                showAlert('Cập nhật sản phẩm thành công!', 'success');
            } else {
                result = await createProduct(formData);
                showAlert('Thêm sản phẩm thành công!', 'success');
            }
            
            // Redirect to list after 2 seconds
            setTimeout(() => {
                window.location.href = '/admin/products';
            }, 2000);
            
        } catch (error) {
            console.error('Error saving product:', error);
        } finally {
            submitBtn.innerHTML = `<i class="bi bi-check-lg"></i> ${isEdit ? 'Cập nhật' : 'Thêm mới'}`;
            submitBtn.disabled = false;
        }
    });

    // Load data when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadCategories();
        loadUsers();
        loadProduct();
    });
    </script>
</div>
