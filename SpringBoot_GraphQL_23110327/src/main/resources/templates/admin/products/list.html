<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Quản lý sản phẩm - Admin Panel</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="m-0"><i class="bi bi-box"></i> Sản phẩm</h3>
                <a href="/admin/products/add" class="btn btn-primary"><i class="bi bi-plus"></i> Thêm sản phẩm</a>
            </div>

            <div th:if="${alert}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${alert}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${param.success == '1'}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle"></i> Thao tác thành công!
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-4 col-md-3">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Tìm theo tên..." />
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="button" onclick="searchProducts()">
                        <i class="bi bi-search"></i> Tìm kiếm
                    </button>
                    <a href="/admin/products/searchpaginated" class="btn btn-outline-success ms-2">
                        <i class="bi bi-search"></i> Tìm kiếm phân trang
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th style="width: 100px;">UserID</th>
                                <th style="width: 120px;">Giá</th>
                                <th style="width: 100px;">Tồn kho</th>
                                <th style="width: 100px;">Lượt mua</th>
                                <th style="width: 140px;">Hình ảnh</th>
                                <th style="width: 160px;" class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be loaded here via GraphQL + AJAX -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        // Test JavaScript
        console.log('Script loaded!');
        
        // GraphQL endpoint
        const GRAPHQL_ENDPOINT = '/graphql';

        // Show/hide loading indicator
        function showLoading(show) {
            console.log('showLoading called with:', show);
            const tbody = document.getElementById('productsTableBody');
            if (show) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Đang tải...</span>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertContainer = document.querySelector('.container-fluid');
            const alertClass = type === 'error' ? 'alert-danger' : 
                             type === 'success' ? 'alert-success' : 'alert-info';
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                <i class="bi bi-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.insertBefore(alertDiv, alertContainer.firstChild);
        }

        // Execute GraphQL query
        async function executeGraphQL(query, variables = {}) {
            console.log('Executing GraphQL query:', query);
            console.log('Variables:', variables);
            
            try {
                const response = await fetch(GRAPHQL_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: variables
                    })
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('GraphQL result:', result);
                
                if (result.errors) {
                    console.error('GraphQL errors:', result.errors);
                    throw new Error(result.errors[0].message);
                }
                
                return result.data;
            } catch (error) {
                console.error('GraphQL Error:', error);
                showAlert('Lỗi: ' + error.message, 'error');
                throw error;
            }
        }

        // Load all products
        async function loadAllProducts() {
            console.log('loadAllProducts called');
            showLoading(true);
            
            const query = `
                query {
                    products {
                        id
                        productName
                        description
                        price
                        stock
                        purchases
                        image
                        category {
                            id
                            categoryName
                        }
                        user {
                            id
                            fullName
                            userName
                        }
                    }
                }
            `;

            try {
                const data = await executeGraphQL(query);
                console.log('GraphQL Response:', data); // Debug log
                console.log('Products from response:', data.products);
                console.log('Products type:', typeof data.products);
                console.log('Products is array:', Array.isArray(data.products));
                displayProducts(data.products || []);
            } catch (error) {
                console.error('Error loading products:', error);
                showAlert('Lỗi tải dữ liệu: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // Search products
        async function searchProducts() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            
            if (!keyword) {
                loadAllProducts();
                return;
            }

            showLoading(true);
            
            const query = `
                query SearchProducts($keyword: String!) {
                    searchProducts(keyword: $keyword) {
                        id
                        productName
                        description
                        price
                        stock
                        purchases
                        image
                        category {
                            id
                            categoryName
                        }
                        user {
                            id
                            fullName
                            userName
                        }
                    }
                }
            `;

            try {
                const data = await executeGraphQL(query, { keyword });
                displayProducts(data.searchProducts);
            } catch (error) {
                console.error('Error searching products:', error);
            } finally {
                showLoading(false);
            }
        }

        // Display products in table
        function displayProducts(products) {
            console.log('Displaying products:', products);
            console.log('Products count:', products ? products.length : 'null');
            const tbody = document.getElementById('productsTableBody');
            
            if (!products || products.length === 0) {
                console.log('No products to display');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">Không có dữ liệu</td>
                    </tr>
                `;
                return;
            }

            console.log('Rendering', products.length, 'products');

            tbody.innerHTML = products.map(product => `
                <tr>
                    <td>${product.id}</td>
                                <td>
                                    <div>
                            <strong>${product.productName}</strong>
                                        <br>
                            <small class="text-muted">${product.description || ''}</small>
                                    </div>
                                </td>
                    <td>${product.category?.categoryName || 'N/A'}</td>
                    <td>
                        <span class="badge bg-secondary">${product.user?.id || 'N/A'}</span>
                    </td>
                                <td>
                        <span class="text-primary fw-bold">${formatPrice(product.price)} VNĐ</span>
                                </td>
                                <td>
                        <span class="badge bg-info">${product.purchases || 0}</span>
                                </td>
                                <td>
                        <span class="${product.stock > 10 ? 'text-success fw-bold' : product.stock > 0 ? 'text-warning fw-bold' : 'text-danger fw-bold'}">${product.stock || 0}</span>
                                </td>
                                <td>
                        ${product.image ? 
                            `<img src="/image?fname=${product.image}" alt="Product Image" style="height:40px; width:60px; object-fit:cover; border-radius:4px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` +
                            `<div style="display:none; height:40px; width:60px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; align-items:center; justify-content:center;"><i class="bi bi-image text-muted"></i></div>` :
                            `<div style="height:40px; width:60px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; display:flex; align-items:center; justify-content:center;"><i class="bi bi-image text-muted"></i></div>`
                        }
                                </td>
                                <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" href="/admin/products/edit/${product.id}">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                                </td>
                            </tr>
            `).join('');
        }

        // Format price
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price);
        }

        // Delete product
        async function deleteProduct(productId) {
            if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                return;
            }

            console.log('Deleting product with ID:', productId);

            const mutation = `
                mutation DeleteProduct($id: Int!) {
                    deleteProduct(id: $id)
                }
            `;

            try {
                const data = await executeGraphQL(mutation, { id: productId });
                
                if (data.deleteProduct) {
                    showAlert('Xóa sản phẩm thành công!', 'success');
                    loadAllProducts(); // Reload the list
                } else {
                    showAlert('Không thể xóa sản phẩm!', 'error');
                }
            } catch (error) {
                console.error('Error deleting product:', error);
                showAlert('Lỗi xóa sản phẩm: ' + error.message, 'error');
            }
        }

        // Search on Enter key
        document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        // Load products when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('JavaScript is running!');
            console.log('DOM loaded, starting to load products...');
            console.log('GraphQL endpoint:', GRAPHQL_ENDPOINT);
            loadAllProducts();
        });
    </script>
</div>
